<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل النجوم</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 80px; height: 80px; margin-left: 15px; border-radius: 5px; }
        h2 { color: #1a237e; margin: 0; }
        p { color: #555; margin: 5px 0 0; }
    </style>
</head>
<body>
    <h1>دليل النجوم والطوالع</h1>
    <div id="stars-container">
        <div class="card">
            <img src="images/icon_star_1.png" alt="نجم">
            <div>
                <h2>الشرطين</h2>
                <p>أول نجوم فصل الربيع...</p>
            </div>
        </div>
    </div>
</body>
</html>
